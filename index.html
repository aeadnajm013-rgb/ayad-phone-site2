<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayad Phone - Apple ID Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary-color: #0071e3; 
            --bg-color: #f5f5f7; 
            --card-bg: #ffffff; 
            --text-color: #1d1d1f; 
            --success-color: #34c759; 
            --warning-color: #ff9500; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Arabic', 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #d2d2d7; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 700; color: var(--text-color); }
        .lang-switcher select { padding: 8px 12px; border-radius: 8px; border: 1px solid #d2d2d7; background-color: #fff; cursor: pointer; font-size: 14px; }
        main { flex: 1; max-width: 600px; width: 100%; margin: 30px auto; padding: 0 20px; }
        .warning-card { background-color: #fff4e5; border-right: 5px solid var(--warning-color); padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .warning-card h3 { color: #b76e00; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .warning-text { font-size: 15px; line-height: 1.6; font-weight: 600; }
        .data-card { background-color: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #86868b; }
        .field-container { display: flex; position: relative; background: #f5f5f7; border-radius: 10px; overflow: hidden; border: 1px solid #d2d2d7; }
        .field-container input { flex: 1; border: none; background: transparent; padding: 14px; font-size: 16px; color: var(--text-color); outline: none; font-family: 'Inter', sans-serif; }
        .copy-btn { background: var(--primary-color); color: white; border: none; padding: 0 20px; cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .copy-btn.copied { background-color: var(--success-color) !important; }
        .otp-section { background: #f5f5f7; border-radius: 12px; padding: 20px; text-align: center; border: 1px dashed #d2d2d7; }
        .otp-title { font-size: 14px; color: #86868b; margin-bottom: 10px; font-weight: 600; }
        .otp-display { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: var(--primary-color); margin: 15px 0; font-family: 'Noto Sans Arabic', 'Inter', sans-serif; }
        .countdown-text { font-size: 13px; color: var(--warning-color); font-weight: bold; margin-top: 5px; display: none; }
        .update-btn { background: #fff; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; }
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background-color: #25d366; color: white; border-radius: 50px; text-align: center; font-size: 30px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; text-decoration: none; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        footer { text-align: center; padding: 20px; font-size: 13px; color: #86868b; border-top: 1px solid #d2d2d7; background: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Ayad Phone</div>
        <div class="lang-switcher">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="ku">Kurdî</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </div>
    </header>

    <main>
        <div class="warning-card">
            <h3 id="warningTitle"><i class="fa-solid fa-triangle-exclamation"></i> ئاگەداری گرنگ</h3>
            <p class="warning-text" id="warningText">تکایە هیچ کاتێک لە ڕێکخستن (Settings) ئەم ئەپڵ ئایدییە داخل مەکە، تەنها لە ئەپ ستۆر (App Store) بەکاری بهێنە.</p>
        </div>

        <div class="data-card">
            <div class="input-group">
                <label id="lblEmail">ئیمەیڵ / Apple ID</label>
                <div class="field-container" dir="ltr">
                    <input type="text" id="emailField" value="بارکردن..." readonly>
                    <button class="copy-btn" onclick="copyText('emailField', this)">
                        <i class="fa-regular fa-copy"></i> <span class="btn-text">Copy</span>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label id="lblPassword">پاسوۆرد / Password</label>
                <div class="field-container" dir="ltr">
                    <input type="text" id="passField" value="بارکردن..." readonly>
                    <button class="copy-btn" onclick="copyText('passField', this)">
                        <i class="fa-regular fa-copy"></i> <span class="btn-text">Copy</span>
                    </button>
                </div>
            </div>

            <div class="otp-section">
                <div class="otp-title" id="lblOtp">کۆدی دڵنیایی (OTP)</div>
                <div class="otp-display" id="otpCode">------</div>
                <div class="countdown-text" id="countdownTxt">کۆدەکە دەسڕێتەوە دوای ٢٠ چرکە...</div>
                <button class="update-btn" onclick="refreshOTP()">
                    <i class="fa-solid fa-rotate"></i> <span id="btnUpdate">تازەکردنەوە (Update)</span>
                </button>
            </div>
        </div>
    </main>

    <a href="https://wa.me/qr/VTPQFLT664KLF1" class="whatsapp-float" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
    <footer>&copy; 2026 Ayad Phone. All Rights Reserved.</footer>

    <script>
        // 🎯 لێرانە بەستەرە جێگیرەکەت بە سەرکەوتوویی نوێکرایەوە
        const API_URL = "https://script.google.com/macros/s/AKfycbx2mIwgeu0tTm8LXFQ4yDa8cOxG_SSrwkzS_Q2Xs1ezXueZ6YpB7vVWAFtC9uA7-bo9/exec";
        let timerInstance = null; 

        const translations = {
            ku: { dir: "rtl", warningTitle: "<i class='fa-solid fa-triangle-exclamation'></i> ئاگەداری گرنگ", warningText: "تکایە هیچ کاتێک لە ڕێکخستن (Settings) ئەم ئەپڵ ئایدییە داخل مەکە، تەنها لە ئەپ ستۆر (App Store) بەکاری بهێنە.", lblEmail: "ئیمەیڵ / Apple ID", lblPassword: "پاسوۆرد / Password", lblOtp: "کۆدی دڵنیایی (OTP)", btnUpdate: "تازەکردنەوە (Update)", copied: "کۆپی کرا!", noCode: "کۆد نییە، چاوەڕوان بە...", timer: "کۆدەکە دەسڕێتەوە دوای ٢٠ چرکە..." },
            ar: { dir: "rtl", warningTitle: "<i class='fa-solid fa-triangle-exclamation'></i> تنبيه هام", warningText: "رجاءً لا تقم بتسجيل الدخول بحساب Apple ID هذا في الإعدادات (Settings)، استخدمه فقط داخل متجر التطبيقات (App Store).", lblEmail: "البريد الإلكتروني / Apple ID", lblPassword: "كلمة المرور / Password", lblOtp: "رمز التحقق (OTP)", btnUpdate: "تحديث (Update)", copied: "تم النسخ!", noCode: "لا يوجد رمز، انتظر...", timer: "سيختفي الرمز بعد ٢٠ ثانية..." },
            en: { dir: "ltr", warningTitle: "<i class='fa-solid fa-triangle-exclamation'></i> Important Notice", warningText: "Please never sign in with this Apple ID in the Settings of your device. Use it exclusively inside the App Store.", lblEmail: "Email / Apple ID", lblPassword: "Password", lblOtp: "Verification Code (OTP)", btnUpdate: "Refresh (Update)", copied: "Copied!", noCode: "No Code, Wait...", timer: "Code expires in 20 seconds..." }
        };

        function loadAccountAndData() {
            const urlParams = new URLSearchParams(window.location.search);
            let emailParam = urlParams.get('email') || "";
            
            if (!emailParam) {
                document.getElementById("emailField").value = "زانیاری دیاری نەکراوە";
                document.getElementById("passField").value = "------";
                return;
            }
            
            if (emailParam.includes("_")) {
                let parts = emailParam.split("_");
                document.getElementById("emailField").value = parts[0].trim(); 
                document.getElementById("passField").value = parts[1].trim();  
            } else {
                document.getElementById("emailField").value = emailParam;
                document.getElementById("passField").value = "------";
            }
            
            document.getElementById("otpCode").innerText = "------";
            document.getElementById("otpCode").style.color = "#0071e3";
        }

        function changeLanguage() {
            const lang = document.getElementById("langSelect").value;
            const t = translations[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = t.dir;
            document.getElementById("warningTitle").innerHTML = t.warningTitle;
            document.getElementById("warningText").innerText = t.warningText;
            document.getElementById("lblEmail").innerText = t.lblEmail;
            document.getElementById("lblPassword").innerText = t.lblPassword;
            document.getElementById("lblOtp").innerText = t.lblOtp;
            document.getElementById("btnUpdate").innerText = t.btnUpdate;
            document.getElementById("countdownTxt").innerText = t.timer;
        }

        function copyText(fieldId, btn) {
            const inputField = document.getElementById(fieldId);
            inputField.select();
            navigator.clipboard.writeText(inputField.value).then(() => {
                const currentLang = document.getElementById("langSelect").value;
                const txt = btn.querySelector('.btn-text');
                const origText = txt.innerText;
                btn.classList.add('copied');
                txt.innerText = translations[currentLang].copied;
                setTimeout(() => { btn.classList.remove('copied'); txt.innerText = origText; }, 2000);
            });
        }

        function refreshOTP() {
            const btn = document.querySelector('.update-btn i');
            const currentLang = document.getElementById("langSelect").value;
            if(btn) btn.classList.add('fa-spin'); 
            
            if (timerInstance) clearTimeout(timerInstance);
            document.getElementById("countdownTxt").style.display = "none";
            
            fetch(`${API_URL}?action=getLatestCode`)
            .then(res => res.json())
            .then(data => {
                let codeIsValid = false;
                
                if (data && data.code && data.code !== "------" && data.code !== "کۆد نەدۆزرایەوە") {
                    if (data.timestamp) {
                        let codeTimeMs = Number(data.timestamp); 
                        let nowMs = new Date().getTime();
                        let differenceInSeconds = (nowMs - codeTimeMs) / 1000; 
                        
                        // ⏱️ پشکنین بۆ یاسای ٣٠ چرکە
                        if (differenceInSeconds >= 0 && differenceInSeconds <= 30) { 
                            codeIsValid = true;
                        }
                    }
                }

                if (codeIsValid) {
                    document.getElementById("otpCode").innerText = data.code;
                    document.getElementById("otpCode").style.color = "#34c759"; 
                    document.getElementById("countdownTxt").style.display = "block"; 
                    
                    timerInstance = setTimeout(() => {
                        document.getElementById("otpCode").innerText = "------";
                        document.getElementById("otpCode").style.color = "#0071e3"; 
                        document.getElementById("countdownTxt").style.display = "none";
                    }, 20000); 
                    
                } else {
                    document.getElementById("otpCode").innerText = translations[currentLang].noCode;
                    document.getElementById("otpCode").style.color = "#ff9500";
                }
                if(btn) btn.classList.remove('fa-spin');
            })
            .catch(() => {
                document.getElementById("otpCode").innerText = translations[currentLang].noCode;
                document.getElementById("otpCode").style.color = "#ff9500";
                if(btn) btn.classList.remove('fa-spin');
            });
        }

        window.onload = loadAccountAndData;
    </script>
</body>
</html>
